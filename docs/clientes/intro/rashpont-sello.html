<title>Rash Pont Apertura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap">
<style>
/* Layout: una sola pantalla de cine (franjas negras arriba y abajo); tres escenas encadenadas: logo, frases y dos puertas. */
:root {
  --ink: #0B0B0B;
  --ink-2: #1A1712;
  --gold: #C9A96E;
  --gold-deep: #A8874F;
  --cream: #F3EDE3;
  --nude: #B89A7A;
  --line: rgba(201,169,110,.55);
  --display: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --label: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--cream);
  font-family: var(--label);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse 70% 55% at 50% 52%, var(--ink-2) 0%, var(--ink) 70%);
  overflow: hidden;
}
#dust { position: absolute; inset: 0; width: 100%; height: 100%; }
.grain {
  position: absolute; inset: -50%; pointer-events: none; opacity: .07; mix-blend-mode: screen;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: grain 1s steps(6) infinite;
}
@keyframes grain { 0%{transform:translate(0,0)} 20%{transform:translate(-3%,2%)} 40%{transform:translate(2%,-3%)} 60%{transform:translate(-2%,-1%)} 80%{transform:translate(3%,3%)} 100%{transform:translate(0,0)} }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%); }

.bar { position: absolute; left: 0; right: 0; height: 11vh; background: #000; z-index: 20; transition: transform 1.4s cubic-bezier(.7,0,.2,1); }
.bar.top { top: 0; } .bar.bottom { bottom: 0; }
.screen.wide .bar.top { transform: translateY(-62%); }
.screen.wide .bar.bottom { transform: translateY(62%); }

.scene { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; visibility: hidden; transition: opacity 1s ease, visibility 0s linear 1s; z-index: 5; }
.scene.on { opacity: 1; visibility: visible; transition: opacity 1s ease, visibility 0s; }

/* Escena 1 · logo */
.logo-wrap { display: grid; justify-items: center; gap: 22px; transform: scale(.96); transition: transform 7s cubic-bezier(.2,.6,.2,1); }
#s1.on .logo-wrap { transform: scale(1.04); }
.seal { width: min(58vw, 260px); height: auto; overflow: visible; }
.seal .ring { fill: none; stroke: var(--gold); stroke-width: 1; stroke-dasharray: 755; stroke-dashoffset: 755; transform: rotate(-90deg); transform-origin: 130px 130px; transition: stroke-dashoffset 2s cubic-bezier(.6,0,.2,1); filter: drop-shadow(0 0 6px rgba(201,169,110,.45)); }
.seal .ring2 { fill: none; stroke: var(--gold); stroke-width: .6; opacity: .6; stroke-dasharray: 3 7; transform-origin: 130px 130px; opacity: 0; transition: opacity 1.2s ease .6s; animation: spin 40s linear infinite; }
.seal .mono { font-family: var(--display); font-style: italic; font-weight: 300; font-size: 92px; fill: url(#goldGrad); opacity: 0; transition: opacity 1.4s ease, filter 1.4s ease; filter: blur(10px); letter-spacing: -4px; }
.seal.draw .ring { stroke-dashoffset: 0; }
.seal.draw .ring2 { opacity: .5; }
.seal.mono-on .mono { opacity: 1; filter: blur(0); }
@keyframes spin { to { transform: rotate(360deg); } }

.name { font-family: var(--display); font-weight: 300; font-size: clamp(34px, 9vw, 64px); letter-spacing: .32em; margin-right: -.32em; text-transform: uppercase; display: flex; white-space: nowrap; }
.name span { display: inline-block; opacity: 0; filter: blur(12px); transform: translateY(14px); transition: opacity 1s ease, filter 1s ease, transform 1.2s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i) * 90ms); }
.name.on span { opacity: 1; filter: blur(0); transform: none; }
.gold-text {
  background: linear-gradient(100deg, var(--gold-deep) 0%, var(--gold) 35%, #F6E7C4 50%, var(--gold) 65%, var(--gold-deep) 100%);
  background-size: 250% 100%; background-position: 100% 0;
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.name.shine span { animation: shine 2.4s ease forwards; }
@keyframes shine { to { background-position: 0 0; } }
.rule { width: 0; height: 1px; background: var(--line); transition: width 1.2s cubic-bezier(.6,0,.2,1); }
.rule.on { width: 64px; }
.tag { font-size: 10px; letter-spacing: .5em; margin-right: -.5em; text-transform: uppercase; color: var(--nude); opacity: 0; transform: translateY(6px); transition: opacity 1.2s ease, transform 1.2s ease; text-align: center; line-height: 2.1; }
.tag.on { opacity: 1; transform: none; }

.flare { position: absolute; left: 50%; top: 50%; width: 140vmax; height: 2px; transform: translate(-50%,-50%) scaleX(0); background: linear-gradient(90deg, transparent, rgba(246,231,196,.0) 20%, rgba(246,231,196,.9) 50%, rgba(246,231,196,0) 80%, transparent); opacity: 0; z-index: 6; pointer-events: none; filter: blur(.5px); }
.flare::after { content: ""; position: absolute; left: 50%; top: 50%; width: 40vmin; height: 40vmin; transform: translate(-50%,-50%); background: radial-gradient(circle, rgba(246,231,196,.35), transparent 60%); }
.flare.go { animation: flare 1.6s cubic-bezier(.3,0,.2,1) forwards; }
@keyframes flare { 0%{opacity:0; transform:translate(-50%,-50%) scaleX(0)} 30%{opacity:1} 100%{opacity:0; transform:translate(-50%,-50%) scaleX(1)} }

/* Escena 2 · frases (como su reel) */
.verses { position: relative; width: min(92vw, 640px); height: min(70vh, 460px); }
.verse { position: absolute; font-family: var(--display); font-style: italic; font-weight: 300; font-size: clamp(22px, 5.4vw, 34px); color: var(--cream); opacity: 0; filter: blur(10px); transform: translateY(10px); transition: opacity 1s ease, filter 1s ease, transform 1.4s ease; white-space: nowrap; }
.verse.on { opacity: .92; filter: blur(0); transform: none; }
.verse.dim { opacity: .22; }
.verse:nth-child(1) { left: 2%; top: 6%; }
.verse:nth-child(2) { right: 2%; top: 26%; }
.verse:nth-child(3) { left: 8%; bottom: 22%; }
.verse:nth-child(4) { right: 6%; bottom: 4%; }
.claim { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 2px; text-align: center; }
.claim .caps { font-family: var(--display); font-weight: 300; font-size: clamp(40px, 11vw, 84px); letter-spacing: .08em; text-transform: uppercase; line-height: 1; opacity: 0; transform: scale(1.12); filter: blur(14px); transition: opacity 1.2s ease, transform 2.4s cubic-bezier(.2,.7,.2,1), filter 1.2s ease; }
.claim .script { font-family: var(--display); font-style: italic; font-weight: 300; font-size: clamp(32px, 8vw, 58px); opacity: 0; transform: translateY(12px); transition: opacity 1.2s ease .5s, transform 1.4s ease .5s; }
.claim.on .caps { opacity: 1; transform: none; filter: blur(0); }
.claim.on .script { opacity: 1; transform: none; }

/* Escena 3 · las dos puertas */
.lobby { display: grid; justify-items: center; gap: clamp(18px, 4vh, 34px); width: min(100%, 760px); }
.lobby-head { display: grid; justify-items: center; gap: 10px; opacity: 0; transform: translateY(-10px); transition: opacity 1s ease, transform 1s ease; }
.lobby-head.on { opacity: 1; transform: none; }
.lobby-head .mini { width: 44px; height: 44px; }
.lobby-head .brand { font-family: var(--display); font-weight: 300; font-size: clamp(22px, 5vw, 30px); letter-spacing: .32em; margin-right: -.32em; text-transform: uppercase; }
.lobby-head .ask { font-size: 10px; letter-spacing: .45em; margin-right: -.45em; text-transform: uppercase; color: var(--nude); }

.doors { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(14px, 5vw, 56px); width: 100%; }
.door { all: unset; box-sizing: border-box; cursor: pointer; display: grid; justify-items: center; gap: 14px; text-align: center; opacity: 0; transform: translateY(24px); transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.7,.2,1), filter .5s ease; transition-delay: var(--d, 0s); -webkit-tap-highlight-color: transparent; }
.door.on { opacity: 1; transform: none; }
.doors:hover .door:not(:hover) { filter: brightness(.5) saturate(.6); }
.door:focus-visible .medal { outline: 1px solid var(--gold); outline-offset: 8px; }
.medal { position: relative; width: min(38vw, 220px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #221d15 0%, #0d0c0a 70%); box-shadow: inset 0 0 0 1px var(--line), 0 0 0 0 rgba(201,169,110,0); transition: box-shadow .6s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
.medal::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 1px dashed rgba(201,169,110,.28); animation: spin 30s linear infinite; }
.door:hover .medal, .door:focus-visible .medal { box-shadow: inset 0 0 0 1px var(--gold), 0 0 60px 4px rgba(201,169,110,.22); transform: scale(1.04); }
.medal svg { width: 46%; height: auto; overflow: visible; }
.medal svg * { fill: none; stroke: var(--gold); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.medal svg .draw { stroke-dasharray: 200; stroke-dashoffset: 200; transition: stroke-dashoffset 1.8s ease var(--d, 0s); }
.door.on .medal svg .draw { stroke-dashoffset: 0; }
.door-name { font-family: var(--display); font-weight: 300; font-size: clamp(22px, 5.2vw, 34px); letter-spacing: .24em; margin-right: -.24em; text-transform: uppercase; }
.door-sub { font-size: clamp(10px, 2.4vw, 12px); line-height: 1.7; color: var(--nude); max-width: 26ch; }
.door-go { font-size: 9px; letter-spacing: .4em; margin-right: -.4em; text-transform: uppercase; color: var(--gold); display: inline-flex; gap: 8px; align-items: center; }
.door-go::after { content: ""; width: 18px; height: 1px; background: var(--gold); transition: width .4s ease; }
.door:hover .door-go::after { width: 34px; }

/* Transición al entrar en una puerta */
.portal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; text-align: center; background: radial-gradient(ellipse at 50% 45%, #2a2219 0%, var(--ink) 65%); clip-path: circle(0 at var(--x, 50%) var(--y, 50%)); transition: clip-path 1.1s cubic-bezier(.7,0,.2,1); pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.portal.on { clip-path: circle(150% at var(--x, 50%) var(--y, 50%)); pointer-events: auto; }
.portal-in { display: grid; justify-items: center; gap: 16px; max-width: 40ch; opacity: 0; transform: translateY(10px); transition: opacity .8s ease .7s, transform .8s ease .7s; }
.portal.on .portal-in { opacity: 1; transform: none; }
.portal h2 { margin: 0; font-family: var(--display); font-weight: 300; font-size: clamp(34px, 8vw, 60px); letter-spacing: .14em; text-transform: uppercase; text-wrap: balance; }
.portal p { margin: 0; font-size: 13px; line-height: 1.8; color: var(--nude); }
.portal .eyebrow { font-size: 10px; letter-spacing: .5em; text-transform: uppercase; color: var(--gold); }

.ctrl { position: fixed; z-index: 50; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
.btn { all: unset; cursor: pointer; font-family: var(--label); font-size: 9px; letter-spacing: .35em; text-transform: uppercase; color: var(--nude); padding: 10px 14px; border: 1px solid rgba(184,154,122,.3); border-radius: 999px; background: rgba(11,11,11,.6); backdrop-filter: blur(6px); transition: color .3s, border-color .3s; }
.btn:hover, .btn:focus-visible { color: var(--gold); border-color: var(--gold); }
.btn.solid { color: var(--ink); background: var(--gold); border-color: var(--gold); }
.btn.solid:hover { background: #d9bb84; color: var(--ink); }
[hidden] { display: none !important; }

@media (max-width: 520px) {
  .doors { gap: 12px; }
  .door-sub { display: none; }
  .verse:nth-child(4) { right: 2%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
}
</style>

<div class="screen" id="screen">
  <canvas id="dust" aria-hidden="true"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="bar top"></div>
  <div class="bar bottom"></div>
  <div class="flare" id="flare"></div>

  <!-- Escena 1 -->
  <section class="scene" id="s1" aria-label="Rash Pont">
    <div class="logo-wrap">
      <svg class="seal" id="seal" viewBox="0 0 260 260" aria-hidden="true">
        <defs>
          <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#A8874F"/><stop offset=".5" stop-color="#F0DDB2"/><stop offset="1" stop-color="#A8874F"/>
          </linearGradient>
        </defs>
        <circle class="ring2" cx="130" cy="130" r="128"/>
        <circle class="ring" cx="130" cy="130" r="120"/>
        <text class="mono" x="130" y="160" text-anchor="middle">rp</text>
      </svg>
      <h1 class="name gold-text" id="name" aria-label="Rash Pont"></h1>
      <div class="rule" id="rule"></div>
      <p class="tag" id="tag">Estética regenerativa · Barbería · Spa<br>Fuengirola</p>
    </div>
  </section>

  <!-- Escena 2 -->
  <section class="scene" id="s2" aria-label="No es solo una cita">
    <div class="verses">
      <p class="verse">Es amor propio.</p>
      <p class="verse">Es autocuidado.</p>
      <p class="verse">Es reconexión.</p>
      <p class="verse">Es bienestar.</p>
      <div class="claim" id="claim">
        <span class="caps">No es solo</span>
        <span class="script gold-text" style="background-position:50% 0">una cita</span>
      </div>
    </div>
  </section>

  <!-- Escena 3 -->
  <section class="scene" id="s3" aria-label="Elige tu espacio">
    <div class="lobby">
      <div class="lobby-head" id="head">
        <svg class="mini" viewBox="0 0 260 260" aria-hidden="true">
          <circle cx="130" cy="130" r="120" fill="none" stroke="#C9A96E" stroke-width="4"/>
          <text x="130" y="160" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-weight="300" font-size="92" fill="#C9A96E" letter-spacing="-4">rp</text>
        </svg>
        <span class="brand gold-text" style="background-position:50% 0">Rash Pont</span>
        <span class="ask">Elige tu espacio</span>
      </div>
      <div class="doors">
        <button class="door" data-door="estetica" style="--d:.15s" type="button">
          <span class="medal">
            <svg viewBox="-50 -50 100 100" aria-hidden="true">
              <rect class="draw" x="-24" y="-38" width="10" height="13" rx="5"/>
              <rect class="draw" x="-26" y="-25" width="14" height="6" rx="1"/>
              <rect class="draw" x="-32" y="-19" width="26" height="46" rx="4"/>
              <line class="draw" x1="-25" y1="2" x2="-13" y2="2"/>
              <path class="draw" d="M20 -12 C20 -12 11 1 11 7 a9 9 0 0 0 18 0 C29 1 20 -12 20 -12Z"/>
            </svg>
          </span>
          <span class="door-name gold-text" style="background-position:50% 0">Estética</span>
          <span class="door-sub">Regenerativa, facial, corporal y spa</span>
          <span class="door-go">Entrar</span>
        </button>
        <button class="door" data-door="barberia" style="--d:.45s" type="button">
          <span class="medal">
            <svg viewBox="-50 -50 100 100" aria-hidden="true">
              <line class="draw" x1="-17" y1="-32" x2="7" y2="9"/>
              <line class="draw" x1="17" y1="-32" x2="-7" y2="9"/>
              <circle class="draw" cx="-11" cy="17" r="8.5"/>
              <circle class="draw" cx="11" cy="17" r="8.5"/>
              <circle cx="0" cy="-3.4" r="1.6" style="fill:#C9A96E;stroke:none"/>
              <line class="draw" x1="26" y1="-36" x2="26" y2="-24"/>
              <line class="draw" x1="20" y1="-30" x2="32" y2="-30"/>
            </svg>
          </span>
          <span class="door-name gold-text" style="background-position:50% 0">Barbería</span>
          <span class="door-sub">Corte, barba y rituales de caballero</span>
          <span class="door-go">Entrar</span>
        </button>
      </div>
    </div>
  </section>
</div>

<div class="portal" id="portal" role="dialog" aria-modal="true" aria-labelledby="portal-title">
  <div class="portal-in">
    <span class="eyebrow" id="portal-eye">Rash Pont</span>
    <h2 id="portal-title">Estética</h2>
    <p id="portal-text"></p>
    <button class="btn solid" id="back" type="button">Volver a la portada</button>
  </div>
</div>

<div class="ctrl">
  <button class="btn" id="skip" type="button">Saltar</button>
  <button class="btn" id="replay" type="button" hidden>Ver otra vez</button>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const screen = $('#screen');
  const scenes = { s1: $('#s1'), s2: $('#s2'), s3: $('#s3') };
  const seal = $('#seal'), nameEl = $('#name'), rule = $('#rule'), tag = $('#tag'), flare = $('#flare');
  const verses = [...document.querySelectorAll('.verse')], claim = $('#claim');
  const head = $('#head'), doors = [...document.querySelectorAll('.door')];
  const skip = $('#skip'), replay = $('#replay');

  // Letras de RASH PONT, una a una
  'RASH PONT'.split('').forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? ' ' : ch;
    s.style.setProperty('--i', i);
    s.className = 'gold-text';
    s.setAttribute('aria-hidden', 'true');
    nameEl.appendChild(s);
  });

  // ---- Polvo dorado ----
  const cv = $('#dust'), ctx = cv.getContext('2d');
  let W = 0, H = 0, motes = [];
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  function size() {
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const n = Math.round(Math.min(120, (W * H) / 9000));
    motes = Array.from({ length: n }, () => mote(true));
  }
  function mote(anywhere) {
    const far = Math.random();
    return {
      x: Math.random() * W, y: anywhere ? Math.random() * H : H + 10,
      r: far < .85 ? Math.random() * 1.3 + .3 : Math.random() * 6 + 3,
      vy: -(Math.random() * .25 + .05), vx: (Math.random() - .5) * .12,
      a: Math.random() * .5 + .15, tw: Math.random() * Math.PI * 2, blur: far >= .85
    };
  }
  let boost = 0;
  function tick(t) {
    ctx.clearRect(0, 0, W, H);
    for (const m of motes) {
      m.x += m.vx; m.y += m.vy * (1 + boost * 3); m.tw += .02;
      if (m.y < -10) Object.assign(m, mote(false));
      const a = m.a * (.6 + .4 * Math.sin(m.tw)) * (m.blur ? .25 : 1);
      if (m.blur) {
        const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r);
        g.addColorStop(0, `rgba(201,169,110,${a})`); g.addColorStop(1, 'rgba(201,169,110,0)');
        ctx.fillStyle = g;
      } else ctx.fillStyle = `rgba(232,208,160,${a})`;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
    }
    boost *= .97;
    requestAnimationFrame(tick);
  }
  size(); addEventListener('resize', size);
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(tick);

  // ---- Guion ----
  let run = 0;
  const timers = [];
  const wait = (ms, me) => new Promise((ok, ko) => timers.push(setTimeout(() => (me === run ? ok() : ko()), ms)));
  const show = (id) => Object.entries(scenes).forEach(([k, el]) => el.classList.toggle('on', k === id));

  function reset() {
    timers.splice(0).forEach(clearTimeout);
    screen.classList.remove('wide');
    seal.classList.remove('draw', 'mono-on');
    nameEl.classList.remove('on', 'shine');
    [rule, tag, claim, head, ...doors].forEach((e) => e.classList.remove('on'));
    verses.forEach((v) => v.classList.remove('on', 'dim'));
    flare.classList.remove('go');
    show(null);
  }

  function lobby() {
    show('s3'); screen.classList.add('wide');
    head.classList.add('on');
    doors.forEach((d) => d.classList.add('on'));
    skip.hidden = true; replay.hidden = false;
  }

  async function play() {
    const me = ++run; reset();
    skip.hidden = false; replay.hidden = true;
    try {
      await wait(400, me);
      show('s1');
      await wait(300, me); seal.classList.add('draw');
      await wait(1500, me); seal.classList.add('mono-on');
      await wait(500, me); nameEl.classList.add('on');
      await wait(900, me); nameEl.classList.add('shine'); flare.classList.add('go'); boost = 1;
      await wait(500, me); rule.classList.add('on');
      await wait(400, me); tag.classList.add('on');
      await wait(1900, me);
      show('s2');
      await wait(700, me);
      for (const v of verses) { v.classList.add('on'); await wait(750, me); }
      verses.forEach((v) => v.classList.add('dim'));
      claim.classList.add('on'); boost = 1;
      await wait(2300, me);
      lobby();
    } catch (_) { /* saltado o repetido */ }
  }

  skip.addEventListener('click', () => { run++; reset(); lobby(); });
  replay.addEventListener('click', play);

  // ---- Puertas ----
  const portal = $('#portal');
  const texts = {
    estetica: { eye: 'Rash Pont · Raquel', title: 'Estética regenerativa', text: 'Aquí empieza la parte de estética: tratamientos faciales y corporales, spa, su agenda y su WhatsApp.' },
    barberia: { eye: 'Rash Pont · Andree', title: 'Barbería', text: 'Aquí empieza la barbería: cortes, barba y rituales, con su propia agenda y su WhatsApp.' }
  };
  doors.forEach((d) => d.addEventListener('click', (e) => {
    const r = d.querySelector('.medal').getBoundingClientRect();
    portal.style.setProperty('--x', `${r.left + r.width / 2}px`);
    portal.style.setProperty('--y', `${r.top + r.height / 2}px`);
    const t = texts[d.dataset.door];
    $('#portal-eye').textContent = t.eye; $('#portal-title').textContent = t.title; $('#portal-text').textContent = t.text;
    portal.classList.add('on'); boost = 1;
    setTimeout(() => $('#back').focus(), 900);
  }));
  $('#back').addEventListener('click', () => portal.classList.remove('on'));
  addEventListener('keydown', (e) => { if (e.key === 'Escape') portal.classList.remove('on'); });

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) lobby(); else play();
})();
</script>
