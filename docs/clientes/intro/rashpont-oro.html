<title>Rash Pont Oro Líquido</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap">
<style>
/* Layout: pantalla de cine en tres actos — una gota de oro (ellas), un corte de tijera (ellos) y el polvo dorado que se une en el sello — y después las dos puertas. */
:root {
  --ink: #0B0B0B;
  --ink-2: #1A1712;
  --gold: #C9A96E;
  --gold-deep: #A8874F;
  --gold-light: #F0DDB2;
  --cream: #F3EDE3;
  --nude: #B89A7A;
  --line: rgba(201,169,110,.55);
  --display: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --label: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--cream); font-family: var(--label); overflow: hidden; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.screen { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(ellipse 70% 55% at 50% 52%, var(--ink-2) 0%, var(--ink) 70%); }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
.grain { position: absolute; inset: -50%; pointer-events: none; opacity: .07; mix-blend-mode: screen; z-index: 8;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: grain 1s steps(6) infinite; }
@keyframes grain { 0%{transform:translate(0,0)} 20%{transform:translate(-3%,2%)} 40%{transform:translate(2%,-3%)} 60%{transform:translate(-2%,-1%)} 80%{transform:translate(3%,3%)} 100%{transform:translate(0,0)} }
.vignette { position: absolute; inset: 0; pointer-events: none; z-index: 7; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%); }
.bar { position: absolute; left: 0; right: 0; height: 11vh; background: #000; z-index: 20; transition: transform 1.4s cubic-bezier(.7,0,.2,1); }
.bar.top { top: 0; } .bar.bottom { bottom: 0; }
.screen.wide .bar.top { transform: translateY(-62%); }
.screen.wide .bar.bottom { transform: translateY(62%); }

/* Rótulos de cine */
.credit { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; z-index: 6; opacity: 0; transition: opacity 1.2s ease; pointer-events: none; text-align: center; }
.credit.on { opacity: 1; }
.credit small { font-size: 9px; letter-spacing: .6em; margin-right: -.6em; text-transform: uppercase; color: var(--nude); }
.credit span { font-family: var(--display); font-style: italic; font-weight: 300; font-size: clamp(18px, 4vw, 24px); color: var(--cream); opacity: .8; }
.cap { position: absolute; left: 0; right: 0; top: 70%; text-align: center; z-index: 6; font-family: var(--display); font-style: italic; font-weight: 300; font-size: clamp(26px, 6vw, 42px); color: var(--cream); opacity: 0; filter: blur(10px); transform: translateY(8px); transition: opacity 1s ease, filter 1s ease, transform 1.2s ease; pointer-events: none; }
.cap small { display: block; margin-top: 10px; font-family: var(--label); font-style: normal; font-size: 9px; letter-spacing: .55em; margin-right: -.55em; text-transform: uppercase; color: var(--gold); }
.cap.on { opacity: 1; filter: blur(0); transform: none; }

.scene { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; visibility: hidden; transition: opacity 1s ease, visibility 0s linear 1s; z-index: 5; }
.scene.on { opacity: 1; visibility: visible; transition: opacity 1s ease, visibility 0s; }

/* Acto 3 · el sello */
.logo-wrap { display: grid; justify-items: center; gap: 22px; }
.seal { width: min(58vw, 260px); height: auto; overflow: visible; }
.seal .ring { fill: none; stroke: var(--gold); stroke-width: 1; stroke-dasharray: 755; stroke-dashoffset: 755; transform: rotate(-90deg); transform-origin: 130px 130px; transition: stroke-dashoffset 1.8s cubic-bezier(.6,0,.2,1); filter: drop-shadow(0 0 6px rgba(201,169,110,.45)); }
.seal .ring2 { fill: none; stroke: var(--gold); stroke-width: .6; stroke-dasharray: 3 7; transform-origin: 130px 130px; opacity: 0; transition: opacity 1.2s ease .6s; animation: spin 40s linear infinite; }
.seal .mono { font-family: var(--display); font-style: italic; font-weight: 300; font-size: 92px; fill: url(#goldGrad); opacity: 0; transition: opacity 1.2s ease; letter-spacing: -4px; }
.seal.draw .ring { stroke-dashoffset: 0; }
.seal.draw .ring2 { opacity: .5; }
.seal.mono-on .mono { opacity: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
.name { font-family: var(--display); font-weight: 300; font-size: clamp(34px, 9vw, 64px); letter-spacing: .32em; margin: 0 -.32em 0 0; text-transform: uppercase; display: flex; white-space: nowrap; }
.name span { display: inline-block; opacity: 0; filter: blur(12px); transform: translateY(14px); transition: opacity 1s ease, filter 1s ease, transform 1.2s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i) * 90ms); }
.name.on span { opacity: 1; filter: blur(0); transform: none; }
.gold-text { background: linear-gradient(100deg, var(--gold-deep) 0%, var(--gold) 35%, #F6E7C4 50%, var(--gold) 65%, var(--gold-deep) 100%); background-size: 250% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; color: transparent; }
.name.shine span { animation: shine 2.4s ease forwards; }
@keyframes shine { to { background-position: 0 0; } }
.rule { width: 0; height: 1px; background: var(--line); transition: width 1.2s cubic-bezier(.6,0,.2,1); }
.rule.on { width: 64px; }
.tag { margin: 0; font-size: 10px; letter-spacing: .5em; margin-right: -.5em; text-transform: uppercase; color: var(--nude); opacity: 0; transform: translateY(6px); transition: opacity 1.2s ease, transform 1.2s ease; text-align: center; line-height: 2.1; }
.tag.on { opacity: 1; transform: none; }
.motto { margin: 0; font-family: var(--display); font-style: italic; font-weight: 300; font-size: clamp(18px, 4vw, 24px); color: var(--cream); opacity: 0; transition: opacity 1.4s ease; }
.motto.on { opacity: .85; }
.flare { position: absolute; left: 50%; top: 46%; width: 140vmax; height: 2px; transform: translate(-50%,-50%) scaleX(0); background: linear-gradient(90deg, transparent, rgba(246,231,196,0) 20%, rgba(246,231,196,.9) 50%, rgba(246,231,196,0) 80%, transparent); opacity: 0; z-index: 6; pointer-events: none; }
.glow { position: absolute; left: 50%; top: 46%; width: 50vmin; height: 50vmin; transform: translate(-50%,-50%); background: radial-gradient(circle, rgba(246,231,196,.3), transparent 60%); opacity: 0; z-index: 6; pointer-events: none; }
.flare.go { animation: flare 1.6s cubic-bezier(.3,0,.2,1) forwards; }
.flare.go + .glow { animation: glow 1.6s ease forwards; }
@keyframes glow { 30% { opacity: 1; } 100% { opacity: 0; } }
@keyframes flare { 0%{opacity:0; transform:translate(-50%,-50%) scaleX(0)} 30%{opacity:1} 100%{opacity:0; transform:translate(-50%,-50%) scaleX(1)} }

/* Las dos puertas (de la primera versión) */
.lobby { display: grid; justify-items: center; gap: clamp(18px, 4vh, 34px); width: min(100%, 760px); }
.lobby-head { display: grid; justify-items: center; gap: 10px; opacity: 0; transform: translateY(-10px); transition: opacity 1s ease, transform 1s ease; }
.lobby-head.on { opacity: 1; transform: none; }
.lobby-head .mini { width: 44px; height: 44px; }
.lobby-head .brand { font-family: var(--display); font-weight: 300; font-size: clamp(22px, 5vw, 30px); letter-spacing: .32em; margin-right: -.32em; text-transform: uppercase; }
.lobby-head .ask { font-size: 10px; letter-spacing: .45em; margin-right: -.45em; text-transform: uppercase; color: var(--nude); }
.doors { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(14px, 5vw, 56px); width: 100%; }
.door { all: unset; box-sizing: border-box; cursor: pointer; display: grid; justify-items: center; gap: 14px; text-align: center; opacity: 0; transform: translateY(24px); transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.7,.2,1), filter .5s ease; transition-delay: var(--d, 0s); -webkit-tap-highlight-color: transparent; }
.door.on { opacity: 1; transform: none; }
.doors:hover .door:not(:hover) { filter: brightness(.5) saturate(.6); }
.door:focus-visible .medal { outline: 1px solid var(--gold); outline-offset: 8px; }
.medal { position: relative; width: min(38vw, 220px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #221d15 0%, #0d0c0a 70%); box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow .6s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
.medal::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 1px dashed rgba(201,169,110,.28); animation: spin 30s linear infinite; }
.door:hover .medal, .door:focus-visible .medal { box-shadow: inset 0 0 0 1px var(--gold), 0 0 60px 4px rgba(201,169,110,.22); transform: scale(1.04); }
.medal .wave { position: absolute; inset: 22%; border-radius: 50%; border: 1px solid var(--gold); opacity: 0; transform: scaleY(.35); }
.door:hover .medal .wave { animation: wave 1.6s ease-out infinite; }
.door:hover .medal .wave:nth-child(2) { animation-delay: .5s; }
@keyframes wave { 0% { opacity: .8; transform: scale(.2, .07); } 100% { opacity: 0; transform: scale(1.4, .5); } }
.medal svg { width: 46%; height: auto; overflow: visible; position: relative; }
.medal svg * { fill: none; stroke: var(--gold); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.medal svg .draw { stroke-dasharray: 200; stroke-dashoffset: 200; transition: stroke-dashoffset 1.8s ease var(--d, 0s); }
.door.on .medal svg .draw { stroke-dashoffset: 0; }
.blade { transform-box: view-box; transform-origin: 0 -3.4px; transition: transform .25s ease; }
.door:hover .blade.a { animation: snipA .9s ease-in-out infinite; }
.door:hover .blade.b { animation: snipB .9s ease-in-out infinite; }
@keyframes snipA { 50% { transform: rotate(14deg); } }
@keyframes snipB { 50% { transform: rotate(-14deg); } }
.door-name { font-family: var(--display); font-weight: 300; font-size: clamp(22px, 5.2vw, 34px); letter-spacing: .24em; margin-right: -.24em; text-transform: uppercase; }
.door-sub { font-size: clamp(10px, 2.4vw, 12px); line-height: 1.7; color: var(--nude); max-width: 26ch; }
.door-go { font-size: 9px; letter-spacing: .4em; margin-right: -.4em; text-transform: uppercase; color: var(--gold); display: inline-flex; gap: 8px; align-items: center; }
.door-go::after { content: ""; width: 18px; height: 1px; background: var(--gold); transition: width .4s ease; }
.door:hover .door-go::after { width: 34px; }

.portal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; text-align: center; background: radial-gradient(ellipse at 50% 45%, #2a2219 0%, var(--ink) 65%); clip-path: circle(0 at var(--x, 50%) var(--y, 50%)); transition: clip-path 1.1s cubic-bezier(.7,0,.2,1); pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.portal.on { clip-path: circle(150% at var(--x, 50%) var(--y, 50%)); pointer-events: auto; }
.portal-in { display: grid; justify-items: center; gap: 16px; max-width: 40ch; opacity: 0; transform: translateY(10px); transition: opacity .8s ease .7s, transform .8s ease .7s; }
.portal.on .portal-in { opacity: 1; transform: none; }
.portal h2 { margin: 0; font-family: var(--display); font-weight: 300; font-size: clamp(34px, 8vw, 60px); letter-spacing: .14em; text-transform: uppercase; text-wrap: balance; }
.portal p { margin: 0; font-size: 13px; line-height: 1.8; color: var(--nude); }
.portal .eyebrow { font-size: 10px; letter-spacing: .5em; text-transform: uppercase; color: var(--gold); }

.ctrl { position: fixed; z-index: 50; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
.btn { all: unset; cursor: pointer; font-family: var(--label); font-size: 9px; letter-spacing: .35em; text-transform: uppercase; color: var(--nude); padding: 10px 14px; border: 1px solid rgba(184,154,122,.3); border-radius: 999px; background: rgba(11,11,11,.6); backdrop-filter: blur(6px); }
.btn:hover, .btn:focus-visible { color: var(--gold); border-color: var(--gold); }
.btn.solid { color: var(--ink); background: var(--gold); border-color: var(--gold); }
[hidden] { display: none !important; }
@media (max-width: 520px) { .doors { gap: 12px; } .door-sub { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; } }
</style>

<div class="screen" id="screen">
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="bar top"></div>
  <div class="bar bottom"></div>
  <div class="flare" id="flare"></div><div class="glow"></div>

  <div class="credit" id="credit"><small>Rash Pont presenta</small><span>una historia de belleza y bienestar</span></div>
  <p class="cap" id="capA">Para ellas.<small>Estética regenerativa</small></p>
  <p class="cap" id="capB">Para ellos.<small>Barbería</small></p>

  <section class="scene" id="s1" aria-label="Rash Pont">
    <div class="logo-wrap">
      <svg class="seal" id="seal" viewBox="0 0 260 260" aria-hidden="true">
        <defs><linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A8874F"/><stop offset=".5" stop-color="#F0DDB2"/><stop offset="1" stop-color="#A8874F"/></linearGradient></defs>
        <circle class="ring2" cx="130" cy="130" r="128"/>
        <circle class="ring" cx="130" cy="130" r="120"/>
        <text class="mono" x="130" y="160" text-anchor="middle">rp</text>
      </svg>
      <h1 class="name gold-text" id="name" aria-label="Rash Pont"></h1>
      <div class="rule" id="rule"></div>
      <p class="tag" id="tag">Estética regenerativa · Barbería · Spa<br>Fuengirola</p>
      <p class="motto" id="motto">No es solo una cita.</p>
    </div>
  </section>

  <section class="scene" id="s3" aria-label="Elige tu espacio">
    <div class="lobby">
      <div class="lobby-head" id="head">
        <svg class="mini" viewBox="0 0 260 260" aria-hidden="true"><circle cx="130" cy="130" r="120" fill="none" stroke="#C9A96E" stroke-width="4"/><text x="130" y="160" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-weight="300" font-size="92" fill="#C9A96E" letter-spacing="-4">rp</text></svg>
        <span class="brand gold-text" style="background-position:50% 0">Rash Pont</span>
        <span class="ask">Elige tu espacio</span>
      </div>
      <div class="doors">
        <button class="door" data-door="estetica" style="--d:.15s" type="button">
          <span class="medal">
            <span class="wave"></span><span class="wave"></span>
            <svg viewBox="-50 -50 100 100" aria-hidden="true">
              <rect class="draw" x="-24" y="-38" width="10" height="13" rx="5"/><rect class="draw" x="-26" y="-25" width="14" height="6" rx="1"/>
              <rect class="draw" x="-32" y="-19" width="26" height="46" rx="4"/><line class="draw" x1="-25" y1="2" x2="-13" y2="2"/>
              <path class="draw" d="M20 -12 C20 -12 11 1 11 7 a9 9 0 0 0 18 0 C29 1 20 -12 20 -12Z"/>
            </svg>
          </span>
          <span class="door-name gold-text" style="background-position:50% 0">Estética</span>
          <span class="door-sub">Para ellas · regenerativa, facial, corporal y spa</span>
          <span class="door-go">Entrar</span>
        </button>
        <button class="door" data-door="barberia" style="--d:.45s" type="button">
          <span class="medal">
            <svg viewBox="-50 -50 100 100" aria-hidden="true">
              <g class="blade a"><line class="draw" x1="-17" y1="-32" x2="7" y2="9"/><circle class="draw" cx="11" cy="17" r="8.5"/></g>
              <g class="blade b"><line class="draw" x1="17" y1="-32" x2="-7" y2="9"/><circle class="draw" cx="-11" cy="17" r="8.5"/></g>
              <circle cx="0" cy="-3.4" r="1.6" style="fill:#C9A96E;stroke:none"/>
              <line class="draw" x1="26" y1="-36" x2="26" y2="-24"/><line class="draw" x1="20" y1="-30" x2="32" y2="-30"/>
            </svg>
          </span>
          <span class="door-name gold-text" style="background-position:50% 0">Barbería</span>
          <span class="door-sub">Para ellos · corte, barba y rituales</span>
          <span class="door-go">Entrar</span>
        </button>
      </div>
    </div>
  </section>

  <canvas id="fx" aria-hidden="true"></canvas>
</div>

<div class="portal" id="portal" role="dialog" aria-modal="true" aria-labelledby="portal-title">
  <div class="portal-in">
    <span class="eyebrow" id="portal-eye">Rash Pont</span>
    <h2 id="portal-title">Estética</h2>
    <p id="portal-text"></p>
    <button class="btn solid" id="back" type="button">Volver a la portada</button>
  </div>
</div>

<div class="ctrl">
  <button class="btn" id="skip" type="button">Saltar</button>
  <button class="btn" id="replay" type="button" hidden>Ver otra vez</button>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const screen = $('#screen'), credit = $('#credit'), capA = $('#capA'), capB = $('#capB');
  const s1 = $('#s1'), s3 = $('#s3'), seal = $('#seal'), nameEl = $('#name'), rule = $('#rule'), tag = $('#tag'), motto = $('#motto'), flare = $('#flare');
  const head = $('#head'), doors = [...document.querySelectorAll('.door')];
  const skip = $('#skip'), replay = $('#replay');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  'RASH PONT'.split('').forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? ' ' : ch;
    s.style.setProperty('--i', i); s.className = 'gold-text'; s.setAttribute('aria-hidden', 'true');
    nameEl.appendChild(s);
  });

  // ================= Lienzo de efectos =================
  const cv = $('#fx'), ctx = cv.getContext('2d');
  const DPR = Math.min(devicePixelRatio || 1, 2);
  let W = 0, H = 0, CX = 0, CY = 0;
  const GOLD = (a) => `rgba(201,169,110,${a})`, LIGHT = (a) => `rgba(246,231,196,${a})`;
  const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const S = { motes: [], drop: null, rings: [], splash: [], blades: null, flashes: [], slit: null, dust: [] };

  function size() {
    W = cv.clientWidth; H = cv.clientHeight; CX = W / 2; CY = H * .46;
    cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S.motes = Array.from({ length: Math.round(Math.min(90, W * H / 12000)) }, () => mote(true));
  }
  function mote(any) { return { x: Math.random() * W, y: any ? Math.random() * H : H + 8, r: Math.random() * 1.2 + .3, vy: -(Math.random() * .2 + .05), vx: (Math.random() - .5) * .1, a: Math.random() * .4 + .1, t: Math.random() * 6 }; }

  // Pequeño motor de tweens
  const tweens = [];
  function tween(obj, key, to, dur, fn = ease) { tweens.push({ obj, key, from: obj[key], to, dur, t0: performance.now(), fn }); }

  // Acto 1 · la gota
  function dropGold() { S.drop = { x: CX, y: -20, vy: 0 }; }
  function impact() {
    const R = Math.min(W, H * 1.6) * .42;
    for (let i = 0; i < 4; i++) S.rings.push({ r: 4, max: R * (1 - i * .18), life: 1, delay: i * 9 });
    for (let i = 0; i < 26; i++) { const a = -Math.PI / 2 + (Math.random() - .5) * 1.6; const v = Math.random() * 5 + 2; S.splash.push({ x: CX, y: CY, vx: Math.cos(a) * v * .7, vy: Math.sin(a) * v, r: Math.random() * 2 + .6, life: 1 }); }
    S.flashes.push({ x: CX, y: CY, r: 90, life: 1 });
  }
  // Acto 2 · la tijera
  function bladesIn() { S.blades = { open: 0, alpha: 0 }; tween(S.blades, 'alpha', 1, 500); tween(S.blades, 'open', .75, 600); }
  function snip(final) {
    tween(S.blades, 'open', .02, 220, (t) => t * t);
    setTimeout(() => {
      S.flashes.push({ x: CX, y: CY, r: 120, life: 1 });
      if (final) { S.slit = { len: 0, alpha: 1 }; tween(S.slit, 'len', Math.hypot(W, H), 420, (t) => 1 - Math.pow(1 - t, 3)); tween(S.blades, 'alpha', 0, 900); }
      else tween(S.blades, 'open', .75, 260);
    }, 230);
  }
  // Acto 3 · el polvo dorado forma el monograma
  function targets() {
    const r = seal.getBoundingClientRect(), k = r.width / 260;
    const off = document.createElement('canvas'); off.width = W; off.height = H;
    const o = off.getContext('2d');
    o.fillStyle = '#fff'; o.textAlign = 'center'; o.textBaseline = 'alphabetic';
    o.font = `italic 300 ${92 * k}px "Cormorant Garamond", Garamond, serif`;
    if ('letterSpacing' in o) o.letterSpacing = `${-4 * k}px`;
    o.fillText('rp', r.left + 130 * k, r.top + 160 * k);
    const pts = [], d = o.getImageData(0, 0, W, H).data, step = Math.max(2, Math.round(2 * k));
    for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) if (d[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
    // también el anillo
    const cx = r.left + 130 * k, cy = r.top + 130 * k, rr = 120 * k;
    for (let i = 0; i < 220; i++) { const a = (i / 220) * Math.PI * 2; pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
    return pts;
  }
  function assemble() {
    const pts = targets(), R = Math.min(W, H * 1.6) * .42, now = performance.now();
    S.dust = pts.map(([tx, ty], i) => {
      let sx, sy;
      if (i % 2) { const a = Math.random() * Math.PI * 2; sx = CX + Math.cos(a) * R * (.6 + Math.random() * .5); sy = CY + Math.sin(a) * R * .35 * (.6 + Math.random() * .5); }
      else { const t = (Math.random() - .5) * Math.hypot(W, H) * .8, ang = -8 * Math.PI / 180; sx = CX + Math.cos(ang) * t; sy = CY + Math.sin(ang) * t + (Math.random() - .5) * 20; }
      return { sx, sy, tx, ty, x: sx, y: sy, t0: now + Math.random() * 500, dur: 1500 + Math.random() * 500, r: Math.random() * .9 + .7, a: 1 };
    });
  }

  function frame(now) {
    for (let i = tweens.length - 1; i >= 0; i--) {
      const w = tweens[i], p = Math.min(1, (now - w.t0) / w.dur);
      w.obj[w.key] = w.from + (w.to - w.from) * w.fn(p);
      if (p >= 1) tweens.splice(i, 1);
    }
    ctx.clearRect(0, 0, W, H);
    // polvo ambiente
    for (const m of S.motes) {
      m.x += m.vx; m.y += m.vy; m.t += .02; if (m.y < -8) Object.assign(m, mote(false));
      ctx.fillStyle = `rgba(232,208,160,${m.a * (.6 + .4 * Math.sin(m.t))})`;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 7); ctx.fill();
    }
    ctx.globalCompositeOperation = 'lighter';
    // gota
    if (S.drop) {
      const d = S.drop; d.vy += .55; d.y += d.vy;
      const stretch = Math.min(26, 6 + d.vy * 1.1);
      const g = ctx.createRadialGradient(d.x - 2, d.y - 2, 0, d.x, d.y, stretch);
      g.addColorStop(0, LIGHT(1)); g.addColorStop(.5, GOLD(.95)); g.addColorStop(1, GOLD(0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(d.x, d.y - stretch * .4, 6, stretch, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = GOLD(.25); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(d.x, d.y - stretch * 3); ctx.lineTo(d.x, d.y - stretch); ctx.stroke();
      if (d.y >= CY) { S.drop = null; impact(); }
    }
    // ondas (superficie vista en perspectiva)
    S.rings = S.rings.filter((r) => r.life > 0);
    for (const r of S.rings) {
      if (r.delay > 0) { r.delay--; continue; }
      r.r += (r.max - r.r) * .028; r.life -= .0065;
      ctx.strokeStyle = GOLD(Math.max(0, r.life) * .9); ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.ellipse(CX, CY, r.r, r.r * .3, 0, 0, 7); ctx.stroke();
    }
    S.splash = S.splash.filter((s) => s.life > 0);
    for (const s of S.splash) {
      s.vy += .22; s.x += s.vx; s.y += s.vy; s.life -= .018;
      if (s.y > CY && s.vy > 0) s.life = 0;
      ctx.fillStyle = LIGHT(Math.max(0, s.life)); ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    }
    // tijera
    if (S.blades && S.blades.alpha > .01) {
      const L = Math.min(W, H) * .62, b = S.blades;
      for (const sgn of [1, -1]) {
        ctx.save(); ctx.translate(CX, CY); ctx.rotate(-Math.PI / 2 + sgn * b.open / 2);
        const g = ctx.createLinearGradient(-L * .2, 0, L * .6, 0);
        g.addColorStop(0, GOLD(0)); g.addColorStop(.25, GOLD(.9 * b.alpha)); g.addColorStop(.8, LIGHT(b.alpha)); g.addColorStop(1, LIGHT(0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(-L * .16, -1.5); ctx.lineTo(0, -3.5); ctx.lineTo(L * .6, 0); ctx.lineTo(0, 3.5); ctx.lineTo(-L * .16, 1.5); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = GOLD(.85 * b.alpha); ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(-L * .16 - 16, 0, 15, 0, 7); ctx.stroke();
        ctx.restore();
      }
      ctx.fillStyle = LIGHT(b.alpha); ctx.beginPath(); ctx.arc(CX, CY, 2.6, 0, 7); ctx.fill();
    }
    // corte de luz
    if (S.slit) {
      const s = S.slit, ang = -8 * Math.PI / 180, dx = Math.cos(ang) * s.len / 2, dy = Math.sin(ang) * s.len / 2;
      s.alpha -= .012;
      if (s.alpha <= 0) S.slit = null;
      else {
        ctx.save(); ctx.shadowColor = LIGHT(1); ctx.shadowBlur = 24;
        ctx.strokeStyle = LIGHT(s.alpha); ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(CX - dx, CY - dy); ctx.lineTo(CX + dx, CY + dy); ctx.stroke(); ctx.restore();
      }
    }
    // destellos
    S.flashes = S.flashes.filter((f) => f.life > 0);
    for (const f of S.flashes) {
      f.life -= .03;
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * (1.4 - f.life * .4));
      g.addColorStop(0, LIGHT(f.life * .9)); g.addColorStop(1, LIGHT(0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 1.4, 0, 7); ctx.fill();
    }
    // polvo que forma el sello
    if (S.dust.length) {
      for (const p of S.dust) {
        const k = Math.max(0, Math.min(1, (now - p.t0) / p.dur)), e = ease(k);
        const sw = Math.sin(k * Math.PI) * 40;
        p.x = p.sx + (p.tx - p.sx) * e + Math.cos(p.t0) * sw;
        p.y = p.sy + (p.ty - p.sy) * e + Math.sin(p.t0) * sw;
        ctx.fillStyle = k >= 1 ? GOLD(p.a * .9) : LIGHT(p.a * .8);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }
  size(); addEventListener('resize', size);
  if (!reduce) requestAnimationFrame(frame);

  // ================= Guion =================
  let run = 0; const timers = [];
  const wait = (ms, me) => new Promise((ok, ko) => timers.push(setTimeout(() => (me === run ? ok() : ko()), ms)));

  function clearFx() { S.drop = null; S.rings = []; S.splash = []; S.blades = null; S.flashes = []; S.slit = null; S.dust = []; tweens.length = 0; }
  function reset() {
    timers.splice(0).forEach(clearTimeout); clearFx();
    screen.classList.remove('wide');
    seal.classList.remove('draw', 'mono-on'); nameEl.classList.remove('on', 'shine');
    [credit, capA, capB, s1, s3, rule, tag, motto, head, ...doors].forEach((e) => e.classList.remove('on'));
    flare.classList.remove('go');
  }
  function fadeDust() { S.dust.forEach((p) => tween(p, 'a', 0, 900)); setTimeout(() => { S.dust = []; }, 950); }
  function lobby() {
    clearFx(); s1.classList.remove('on'); s3.classList.add('on'); screen.classList.add('wide');
    head.classList.add('on'); doors.forEach((d) => d.classList.add('on'));
    skip.hidden = true; replay.hidden = false;
  }

  async function play() {
    const me = ++run; reset(); skip.hidden = false; replay.hidden = true;
    try { await document.fonts.load('italic 300 92px "Cormorant Garamond"'); } catch (_) {}
    try {
      await wait(400, me); credit.classList.add('on');
      await wait(2000, me); credit.classList.remove('on');
      // Acto 1 · Para ellas
      await wait(900, me); dropGold();
      await wait(1100, me); capA.classList.add('on');
      await wait(1700, me); capA.classList.remove('on');
      // Acto 2 · Para ellos
      await wait(500, me); bladesIn();
      await wait(800, me); snip(false);
      await wait(650, me); snip(true);
      await wait(350, me); capB.classList.add('on');
      await wait(1600, me); capB.classList.remove('on');
      // Acto 3 · los dos, unidos
      await wait(400, me); s1.classList.add('on'); assemble(); seal.classList.add('draw');
      await wait(2100, me); seal.classList.add('mono-on'); fadeDust(); flare.classList.add('go');
      await wait(300, me); nameEl.classList.add('on');
      await wait(900, me); nameEl.classList.add('shine');
      await wait(300, me); rule.classList.add('on');
      await wait(400, me); tag.classList.add('on');
      await wait(900, me); motto.classList.add('on');
      await wait(2200, me); lobby();
    } catch (_) { /* saltado o repetido */ }
  }
  skip.addEventListener('click', () => { run++; reset(); lobby(); });
  replay.addEventListener('click', play);

  // ================= Puertas =================
  const portal = $('#portal');
  const texts = {
    estetica: { eye: 'Rash Pont · Raquel', title: 'Estética regenerativa', text: 'Aquí empieza la parte de estética: tratamientos faciales y corporales, spa, su agenda y su WhatsApp.' },
    barberia: { eye: 'Rash Pont · Andrés', title: 'Barbería', text: 'Aquí empieza la barbería: cortes, barba y rituales, con su propia agenda y su WhatsApp.' }
  };
  doors.forEach((d) => d.addEventListener('click', () => {
    const r = d.querySelector('.medal').getBoundingClientRect();
    portal.style.setProperty('--x', `${r.left + r.width / 2}px`); portal.style.setProperty('--y', `${r.top + r.height / 2}px`);
    const t = texts[d.dataset.door];
    $('#portal-eye').textContent = t.eye; $('#portal-title').textContent = t.title; $('#portal-text').textContent = t.text;
    portal.classList.add('on'); setTimeout(() => $('#back').focus(), 900);
  }));
  $('#back').addEventListener('click', () => portal.classList.remove('on'));
  addEventListener('keydown', (e) => { if (e.key === 'Escape') portal.classList.remove('on'); });

  if (reduce) lobby(); else play();
})();
</script>
